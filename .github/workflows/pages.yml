name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Versiona os assets pra furar o cache do navegador
        env:
          SHA: ${{ github.sha }}
        run: |
          sed -i "s/__V__/${SHA:0:8}/g" index.html
          if grep -q "__V__" index.html; then echo "placeholder __V__ não foi substituído"; exit 1; fi
          grep -o '\(app.js\|style.css\)?v=[^"]*' index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
