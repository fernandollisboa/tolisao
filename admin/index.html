<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- o painel do dono: as visitas do site e a busca de eventos. A página é pública e vazia: os números vêm da API
     (POST /admin) só com a chave, e a busca lê o banco com o token de uma hora que ela devolve (admin.js) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; connect-src https://tolisa-api.fernando-costa-fd0.workers.dev https://*.firebaseio.com; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>tô lisa · admin</title>
<link rel="icon" type="image/png" href="../ficha-192.png">
<style>
@font-face{font-family:'VT323';src:url(../fonts/vt323.woff2) format('woff2');font-display:swap}
:root{--wood:#6b4a2b;--paper:#f6efdc;--ink:#222;--ink2:#7a6a4a;--amber:#b86e00;--red:#c0392b;--green:#2f7d4a}
@media (prefers-color-scheme:dark){:root{--wood:#160f0b;--paper:#1d1a17;--ink:#efe6d4;--ink2:#a69a88;--amber:#f0a640;--red:#ff6b5e;--green:#6fcf8f}}
*{box-sizing:border-box}
html{background:var(--wood)}
body{margin:0;min-height:100vh;color:var(--ink);font:20px/1.3 'VT323',ui-monospace,monospace;padding:28px 16px 48px;background:var(--wood)}
main{position:relative;background:var(--paper);max-width:460px;margin:0 auto;padding:22px 18px 30px;box-shadow:0 14px 30px rgba(0,0,0,.35)}
main:before,main:after{content:"";position:absolute;left:0;right:0;height:14px;background:linear-gradient(135deg,transparent 7px,var(--paper) 7px) 0 0/14px 14px,linear-gradient(-135deg,transparent 7px,var(--paper) 7px) 7px 0/14px 14px;background-repeat:repeat-x}
main:before{top:-13px}main:after{bottom:-13px;transform:scaleY(-1)}
h1{text-align:center;font-size:40px;margin:0;letter-spacing:2px;text-transform:uppercase;font-weight:normal}
h2{text-align:center;font-size:20px;letter-spacing:1px;margin:0 0 10px;text-transform:uppercase;font-weight:normal}
.c{text-align:center}.muted{color:var(--ink2)}.hidden{display:none !important}
.hr{border-top:2px dashed var(--ink2);margin:16px 0}
.row{display:flex;gap:6px;align-items:baseline;margin:3px 0}
.row .d{flex:1;border-bottom:2px dotted var(--ink2);transform:translateY(-4px);min-width:12px}
.big{font-size:64px;line-height:1;text-align:center;margin:6px 0 0;color:var(--amber)}
.dia{display:grid;grid-template-columns:5.5ch 3.5ch 1fr 4ch;gap:6px;align-items:center;margin:1px 0;font-size:18px}
.dia .b{height:10px;background:var(--amber);min-width:1px}
.dia.zero .b{background:none}.dia.fds{color:var(--ink2)}.dia .n{text-align:right}
form{display:flex;gap:8px;margin-top:10px}
input,button{font:inherit;font-size:20px;padding:8px 10px;border:2px solid var(--ink);border-radius:0;background:transparent;color:var(--ink)}
input{flex:1;min-width:0}
button{background:var(--ink);color:var(--paper);cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
.err{color:var(--red);text-align:center}
.ev{margin:12px 0;padding-bottom:10px;border-bottom:1px dotted var(--ink2)}
.ev .muted{font-size:17px}
.ev a{color:var(--amber)}
.ev .id{font-size:15px;word-break:break-all;user-select:all}
.nota{font-size:16px}
button.cheio{display:block;width:100%;margin-top:10px}
#testaSt b{color:var(--green);font-weight:normal}
button.mais{display:block;margin:10px auto 0;background:transparent;color:var(--ink2);border:0;font-size:20px;text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>tô lisa</h1>
  <div class="c muted">admin</div>
  <div class="hr"></div>
  <section id="entra">
    <form id="entraForm"><input type="password" id="chave" placeholder="a chave" autocomplete="current-password" required autofocus><button id="entraBtn">entrar</button></form>
    <p class="err" id="entraErr" role="alert"></p>
  </section>
  <section id="painel" class="hidden">
    <div id="visitas"></div>
    <div class="hr"></div>
    <h2>*** procurar evento ***</h2>
    <form id="busca"><input id="buscaQ" placeholder="nome do evento ou de alguém" autocomplete="off" required><button>achar</button></form>
    <p class="c muted" id="buscaSt" role="status"></p>
    <div id="buscaRes"></div>
    <div class="hr"></div>
    <h2>*** aviso no celular ***</h2>
    <div class="c muted nota">manda um push de verdade pra este aparelho e diz o que o cron das 19h faria hoje</div>
    <button id="testaBtn" class="cheio">enviar notificação</button>
    <p class="c muted" id="testaSt" role="status"></p>
    <div id="testaRes"></div>
  </section>
</main>
<script src="admin.js"></script>
</body>
</html>
