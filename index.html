<style>
  @font-face{font-family:'VT323';src:url(fonts/vt323.woff2) format('woff2')}
  @font-face{font-family:'Permanent Marker';src:url(fonts/permanent-marker.woff2) format('woff2')}
  :root{--wood:#6b4a2b;--paper:#f6efdc;--ink:#222;--ink2:#5a4a30;--rule:#7a6a4a;--red:#9b1c1c;--green:#15703a;--muted:#7a6a4a}
  *{box-sizing:border-box}
  html{background:var(--wood);overflow-x:hidden}
  body{margin:0;min-height:100vh;overflow-x:hidden;max-width:100vw;color:var(--ink);font:20px/1.35 'VT323',ui-monospace,monospace;padding:18px 12px 120px;
    background:var(--wood) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" fill="%236b4a2b"/><path d="M0 0h200v200H0z" fill="none" stroke="%235a3d22" stroke-width="2" stroke-dasharray="1 7"/></svg>')}
  .paper{position:relative;background:var(--paper);margin:0 auto;max-width:460px;padding:22px 18px 30px;box-shadow:0 14px 30px rgba(0,0,0,.35);
    background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.025) 0 1px,transparent 1px 3px)}
  .paper:before,.paper:after{content:"";position:absolute;left:0;right:0;height:14px;background:linear-gradient(135deg,transparent 7px,var(--paper) 7px) 0 0/14px 14px,linear-gradient(-135deg,transparent 7px,var(--paper) 7px) 7px 0/14px 14px;background-repeat:repeat-x}
  .paper:before{top:-13px}.paper:after{bottom:-13px;transform:scaleY(-1)}
  .stain{position:absolute;right:6px;top:60px;width:120px;height:120px;border-radius:50%;border:14px solid rgba(190,120,30,.16);box-shadow:inset 0 0 0 3px rgba(190,120,30,.10);transform:rotate(20deg);pointer-events:none}
  h1{font-family:'VT323',monospace;font-size:40px;margin:0;text-align:center;letter-spacing:2px;text-transform:uppercase;font-weight:400;line-height:1}
  h2{font-family:'VT323',monospace;font-size:22px;letter-spacing:3px;text-align:center;margin:14px 0 8px;font-weight:400;text-transform:uppercase}
  .c{text-align:center;font-size:17px;line-height:1.5;text-transform:uppercase}
  .hr{border-top:2px dashed var(--rule);margin:12px 0}
  .row{display:flex;align-items:baseline;line-height:1.7;position:relative;font-size:21px}
  .row .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
  .row .d{flex:1;border-bottom:2px dotted var(--rule);margin:0 6px 5px;min-width:14px}
  .row .v{white-space:nowrap}
  .small{font-size:16px;color:var(--ink2);margin:-4px 0 4px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
  .small>span{flex:1}
  .stamp{position:absolute;right:44px;top:-12px;font-family:'Permanent Marker',cursive;color:var(--red);border:4px solid var(--red);border-radius:6px;padding:0 8px;font-size:20px;line-height:1.3;transform:rotate(-14deg);opacity:.85;letter-spacing:2px;pointer-events:none}
  .paid .l,.paid .v{color:#8a7a5a;text-decoration:line-through}
  .nm{font-weight:400}
  .neg{color:var(--red)}.pos{color:var(--green)}
  .total{font-size:26px;font-weight:400;display:flex;justify-content:space-between;margin-top:6px}
  .bars{margin:18px auto 0;height:40px;width:220px;background:repeating-linear-gradient(90deg,#222 0 2px,transparent 2px 4px,#222 4px 7px,transparent 7px 9px,#222 9px 10px,transparent 10px 14px)}
  .empty{color:var(--muted);font-size:17px;text-align:center;padding:4px 0}
  button,input,select{font:inherit;color:var(--ink)}
  button{background:#fff8e6;border:2px solid var(--ink);border-radius:4px;padding:5px 12px;cursor:pointer;text-transform:uppercase;font-size:17px;letter-spacing:.5px}
  .share2{display:flex;flex-direction:column;align-items:center;gap:12px} .share2 button.big.alt{background:transparent;width:auto;font-size:17px;padding:6px 14px;box-shadow:3px 3px 0 var(--ink);gap:7px;letter-spacing:0}
  button.big{font-size:22px;padding:10px 16px;box-shadow:4px 4px 0 var(--ink);width:100%;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:10px}
  .wa,button.big svg{flex:none;position:relative;top:-1px}

  .chip input{width:auto;margin:0;accent-color:var(--ink)}

  .status{font-size:15px;color:var(--muted);text-transform:uppercase;text-align:center;margin-top:6px}
  .status:empty{display:none}
  .status.err{color:var(--red)}
  .hidden{display:none !important}
  .fab{position:fixed;left:50%;transform:translateX(-50%) rotate(-1.5deg);bottom:22px;z-index:8;background:var(--paper);border:3px solid var(--ink);padding:12px 22px;font-size:22px;letter-spacing:1px;box-shadow:6px 6px 0 var(--ink);border-radius:0;text-transform:uppercase}
  #overlay,#sheet{position:fixed;inset:0;background:rgba(40,25,10,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
  #overlay .paper{max-width:420px;width:100%;padding:24px 20px;max-height:92vh;overflow:auto}
  #sheet .paper{max-width:420px;width:100%;padding:24px 20px;max-height:92vh;overflow:auto}
  code.box{display:block;padding:8px;border:1px dashed var(--rule);word-break:break-all;font-size:16px;user-select:all}
  #mineRows .row.pos .v{color:var(--green)} #mineRows .row.neg .v{color:var(--red)} 
  #mineRows .row.sub{font-size:17px;color:var(--ink2);line-height:1.5} #mineRows .row.sub .v{font-size:17px}
  #mineRows .row.sub .l{white-space:normal;overflow:visible;display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 10px;max-width:72%} #mineRows .row.sub .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .acts{display:inline-flex;gap:8px;align-items:center;min-height:26px} .spin{width:14px;height:14px;border:2px dotted var(--ink2);border-radius:50%;animation:spin 1.1s linear infinite;display:inline-block} @keyframes spin{to{transform:rotate(360deg)}} button.ico{padding:0 6px;height:26px;display:inline-flex;align-items:center;gap:4px;font-size:16px;line-height:1;letter-spacing:0;color:var(--ink)} button.ico svg{display:block} button.ico.ok{color:var(--green);border-color:var(--green)}
  .link.dim{opacity:.5;font-size:13px}
  #mineRows .row.hdr{font-size:15px;color:var(--ink2);line-height:1.4;margin-top:6px} #mineRows .row.hdr .v{font-size:15px;text-transform:uppercase} #mineRows .row.hdr .d{visibility:hidden}
  .row.mine .l,.row.mine .v{background:linear-gradient(transparent 18%,#fff176 18%,#fff176 82%,transparent 82%);padding:0 4px;margin:0 -4px}
  .pixi{display:inline-flex;gap:3px;align-items:center;vertical-align:-2px} .pixi svg{display:block}
  .item .by,.item .who{display:none}
  .item:hover .by,.item.open .by,.item:hover .who,.item.open .who{display:inline}
  .item{cursor:default}
  .tag{display:inline-block;border:1px solid var(--ink);padding:0 5px;font-size:13px;line-height:1.4;margin-right:6px;vertical-align:2px;text-transform:uppercase}
  .day{font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;text-align:center;margin:10px 0 2px}
  #amount{font-size:30px;letter-spacing:1px}
  .shares{display:grid;gap:6px}
  .shares .row{font-size:18px;line-height:1.4;align-items:center}
  .shares input{width:110px;text-align:right;padding:4px}
  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;font-size:17px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;text-transform:uppercase}
  .toast.show{opacity:1}
</style>

<body>
<div id="overlay" class="hidden"><div class="paper" id="overlayBox"></div></div>

<div class="paper" id="app">
  <div class="stain"></div>
  <h1>Tô lisa</h1>
  <div class="c muted" style="margin:-2px 0 6px;text-transform:none">quem me deve?</div>
  <div class="c">Evento <a class="link" id="roomLabel">—</a><br><span id="whoLine"></span></div>

  <div class="hr"></div>

  <div id="mine" class="hidden">
    <h2>*** Minha conta ***</h2>
    <div class="c muted" id="pixLine" style="text-transform:none;font-size:15px;margin:-4px 0 10px"></div>

    <div class="hr"></div>
  </div>

  <h2>*** Itens ***</h2>

  <h2>*** Acerto ***</h2>

  <div class="share2" style="margin:12px 0 4px"><button id="waBtn" class="big"><svg class="wa" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg> Enviar</button><button id="shareBtn" class="big alt"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3" fill="none" stroke="currentColor" stroke-width="2"/></svg> Copiar link</button></div>
  <div class="hr"></div>

  <div class="c" style="text-transform:none"><span id="peopleLine"></span> <a class="link" id="addPerson" title="adicionar pessoa">+</a></div>
  <div class="c" style="margin-top:14px">Valeu, pai!<br>* * *</div>
  <div class="bars"></div>
  <div class="status" id="status"></div>
</div>

<button id="fab" class="fab">✎ Anotar</button>
<div id="sheet" class="hidden"><div class="paper">
  <h2 style="margin-top:0">Anotar</h2><p class="muted" style="margin:0 0 12px;text-align:center">quanto foi, o que foi e quem divide</p>
  <form id="expenseForm">
    <div class="two"><input id="amount" type="number" step="0.01" min="0.01" placeholder="0,00" required inputmode="decimal"><input id="desc" placeholder="O quê?" required maxlength="60"></div>
    <select id="payer" required></select>
    <div class="chips" id="splitChips"></div>
    <div id="sharesBox" class="shares hidden"></div>
    <div class="muted" id="splitHint"></div>
    <div class="muted" style="text-transform:none"><a class="link" id="modeToggle">dividir em partes diferentes</a></div>
    <button class="big">Anotar</button>
  </form>
  <div class="c" style="margin-top:12px"><button id="sheetClose" class="ghost">voltar</button></div>
</div></div>
<div id="toast" class="toast"></div>

<script>
(() => {
  // ---------- config ----------
  // Firebase Realtime Database (REST). Ex.: 'https://racha-xxxxx-default-rtdb.firebaseio.com'
  const DB = 'https://racha-77bc7-default-rtdb.firebaseio.com';
  const POLL_MS = 6000;
  const CURRENCY = 'R$';

  const $ = s => document.querySelector(s);
  const uid = () => Math.random().toString(36).slice(2, 10);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const sha = async s => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))].map(b => b.toString(16).padStart(2, '0')).join('');
  const ls = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }, del: k => { try { localStorage.removeItem(k); } catch {} } };

  let groupId = null, roomName = '', state = null, me = null, pollTimer = null, saving = false;

  const fresh = (name = '') => ({ v:2, name, updatedAt: Date.now(), people:[], expenses:[], deleted:[] });
  const cacheKey = () => `racha:${groupId}`;
  const cacheSave = () => ls.set(cacheKey(), JSON.stringify(state));
  const cacheLoad = () => { try { return JSON.parse(ls.get(cacheKey())); } catch { return null; } };
  const meKey = () => `racha:${groupId}:me`;

  // ---------- merge (união por id; exclusões vencem) ----------
  function merge(a, b){
    if (!a) return b; if (!b) return a;
    const deleted = new Set([...(a.deleted||[]), ...(b.deleted||[])]);
    const byId = list => { const m = new Map(); for (const x of list||[]) if (!deleted.has(x.id)) m.set(x.id, x); return m; };
    const people = new Map([...byId(a.people), ...byId(b.people)]);
    const expenses = new Map([...byId(a.expenses), ...byId(b.expenses)]);
    return { v:2, name: a.name || b.name || '', updatedAt: Math.max(a.updatedAt||0, b.updatedAt||0),
      people:[...people.values()].sort((x,y)=>(x.at||0)-(y.at||0)),
      expenses:[...expenses.values()].sort((x,y)=>x.at-y.at),
      deleted:[...deleted].slice(-500) };
  }

  // ---------- remoto ----------
  const setStatus = (msg, err) => { const el = $('#status'); el.textContent = msg; el.classList.toggle('err', !!err); };
  const roomUrl = id => `${DB}/rooms/${id}.json`;
  async function apiGet(id){
    const r = await fetch(roomUrl(id), { cache:'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    if (data === null) throw Object.assign(new Error('não encontrado'), { notFound:true });
    return data;
  }
  async function apiPut(id, data){
    const r = await fetch(roomUrl(id), { method:'PUT', body: JSON.stringify(data) });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
  }

  async function sync(){            // baixa, mescla e sobe se houver novidade
    if (!groupId || saving) return;
    saving = true;
    try {
      const remote = await apiGet(groupId);
      const merged = merge(state, remote);
      const changed = JSON.stringify(merged) !== JSON.stringify(remote);
      state = merged; cacheSave(); render();
      if (changed) await apiPut(groupId, state);
      setStatus('Sincronizado ' + new Date().toLocaleDateString('pt-BR') + ' ' + new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}));
    } catch (e) {
      if (e.notFound) return showLost();
      setStatus('Offline · ' + e.message, true);
    } finally { saving = false; }
  }
  function commit(){ state.updatedAt = Date.now(); cacheSave(); render(); sync(); }
  let tick = 0;
  function startPolling(){ clearInterval(pollTimer); pollTimer = setInterval(() => { if (!document.hidden) { sync(); if (++tick % 5 === 0) loadPixKeys(); } }, POLL_MS); }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });

  // ---------- contas ----------
  function shares(cents, ids){ const base = Math.floor(cents/ids.length), rem = cents - base*ids.length; const o={}; ids.forEach((id,i)=>o[id]=base+(i<rem?1:0)); return o; }
  const shareOf = (e, ids) => { if (e.shares) { const o = {}; for (const id of ids) o[id] = e.shares[id] || 0; return o; } return shares(Math.round(e.amount*100), ids); };
  const howText = (e, name = nameOf, html = false) => { const loan = !e.among.includes(e.payer);
    if (e.shares) return e.among.map(id => `${name(id)} ${fmt((e.shares[id]||0)/100)}`).join(', ');
    if (loan) return `${e.among.map(name).join(', ')} deve${e.among.length===1?'':'m'} tudo`;
    if (!html) return `÷${e.among.length}`;
    return `<a class="link" data-among="${e.id}" title="ver quem">÷${e.among.length}</a><span class="who"> (${e.among.map(name).join(', ')})</span>`; };
  function balances(){
    const b = {}; state.people.forEach(p => b[p.id] = 0);
    for (const e of state.expenses) {
      const ids = e.among.filter(id => id in b); if (!ids.length || !(e.payer in b)) continue;
      const cents = Math.round(e.amount*100); b[e.payer] += cents; const sh = shareOf(e, ids); for (const id of ids) b[id] -= sh[id];
    }
    return b;
  }
  function settlements(b){
    const d=[], c=[]; for (const [id,v] of Object.entries(b)) { if (v<0) d.push({id,c:-v}); else if (v>0) c.push({id,c:v}); }
    d.sort((x,y)=>y.c-x.c); c.sort((x,y)=>y.c-x.c); const out=[]; let i=0,j=0;
    while (i<d.length && j<c.length) { const a=Math.min(d[i].c,c[j].c); out.push({from:d[i].id,to:c[j].id,cents:a}); d[i].c-=a; c[j].c-=a; if(!d[i].c)i++; if(!c[j].c)j++; }
    return out;
  }

  // ---------- render ----------
  const PALETTE = ['#8b1a1a','#1f4e9c','#a3510a','#15703a','#5b21b6','#0f6b6b','#8a1a6b','#5a4a1a','#374151','#7a2d0c'];
  const colorOf = id => PALETTE[Math.max(0, state.people.findIndex(p => p.id === id)) % PALETTE.length];
  const nm = id => `<span class="nm" style="color:${colorOf(id)}">${esc(nameOf(id))}</span>`;
  const nmByName = name => { const p = state.people.find(q => q.name === name); return p ? nm(p.id) : esc(name); };
  const nmList = ids => ids.map(nm).join(', ');
  let showAll = false; const openItems = new Set();
  let lastSeen = 0; const seenKey = () => `racha:${groupId}:seen`;
  const markSeen = () => { if (groupId) ls.set(seenKey(), String(Date.now())); };
  window.addEventListener('pagehide', markSeen); document.addEventListener('visibilitychange', () => { if (document.hidden) markSeen(); });
  // ---------- pix ----------
  const COPY_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
  const KEY_SVG = '<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M12.65 10A6 6 0 0 0 1 12a6 6 0 0 0 11.65 2H18v3h4v-7h-9.35zM7 14a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg>';
  const OK_SVG = '<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-2 15-5-5 1.4-1.4L10 14.2l7.6-7.6L19 8z"/></svg>';

  $('#toggleAll').onclick = () => { showAll = !showAll; render(); };
  const openSheet = () => { $('#sheet').classList.remove('hidden'); $('#amount').focus(); };
  const closeSheet = () => $('#sheet').classList.add('hidden');
  $('#fab').onclick = () => { if (!state.people.length) return toast('Adicione pessoas primeiro'); openSheet(); };
  $('#sheetClose').onclick = closeSheet;
  $('#sheet').addEventListener('click', ev => { if (ev.target.id === 'sheet') closeSheet(); });
  $('#expenseForm').onsubmit = ev => { ev.preventDefault();
    const among = [...document.querySelectorAll('#splitChips input:checked')].map(i => i.value); const amount = parseFloat($('#amount').value);
    if (!state.people.length) return toast('Adicione pessoas primeiro'); if (!among.length) return toast('Marque quem divide esse gasto'); if (!(amount > 0)) return toast('Valor inválido');
    const exp = { id: uid(), desc: $('#desc').value.trim(), amount: Math.round(amount*100)/100, payer: $('#payer').value, among, at: Date.now(), by: me ? nameOf(me) : undefined };
    if (splitMode === 'custom') { const sh = customShares(); const total = Math.round(amount*100); const sum = among.reduce((a, id) => a + (sh[id] || 0), 0);
      if (sum !== total) return toast(sum < total ? `Faltam ${money((total-sum)/100)} nas partes` : `Sobram ${money((sum-total)/100)} nas partes`);
      exp.shares = {}; for (const id of among) exp.shares[id] = sh[id] || 0; }
    state.expenses.push(exp);
    $('#desc').value = ''; $('#amount').value = ''; splitMode = 'equal'; closeSheet(); commit(); toast('Anotado!'); };
  $('#payer').onchange = updateHint;
  document.addEventListener('change', ev => { if (ev.target.matches('#splitChips input')) { ev.target.closest('.chip').classList.toggle('on', ev.target.checked); updateHint(); } });
  document.addEventListener('click', async ev => {
    if (!ev.target.closest('a,button,input,label')) { const it = ev.target.closest('.item'); if (it) { const id = it.dataset.item; openItems.has(id) ? openItems.delete(id) : openItems.add(id); it.classList.toggle('open'); } }
    const am = ev.target.closest('[data-among]');
    if (am) { const it = am.closest('.item'); const id = it.dataset.item; openItems.has(id) ? openItems.delete(id) : openItems.add(id); it.classList.toggle('open'); return; }
    const evl = ev.target.closest('[data-ev]');
    if (evl) { const code = evl.dataset.ev; if (code === roomName) return closeOverlay(); $('#evList').textContent = 'abrindo…'; enterRoom(code).catch(e => toast(e.message)); return; }
    const px = ev.target.closest('[data-pix]');
    if (px) { const [to, cents] = px.dataset.pix.split('|'); const code = pixCode(pixKeys[to], nameOf(to), +cents);
      navigator.clipboard.writeText(code).then(() => toast('Pix copia e cola copiado. Cola no app do banco.'), () => showCopy('Pix copia e cola', code)); }
    const st = ev.target.closest('[data-settle]');
    if (st) { const [from, to, cents] = st.dataset.settle.split('|'); const amount = +cents/100;
      if (!(await ask('Quitar?', `${nm(from)} pagou <b style="color:var(--green)">${money(amount)}</b> pra ${nm(to)}`, 'quitei'))) return;
      state.expenses.push({ id: uid(), kind:'payment', desc:'Pagamento', amount, payer: from, among:[to], at: Date.now(), by: me ? nameOf(me) : undefined }); commit(); toast('Quitado!');
      window.open('https://wa.me/?text=' + encodeURIComponent(`✅ ${nameOf(to)}, te paguei ${money(amount)} do *${roomName}* 👍\n${shareUrl()}`), '_blank', 'noopener'); }
    const de = ev.target.closest('[data-del-expense]');
    if (de) { const id = de.dataset.delExpense; const e = state.expenses.find(x => x.id === id); if (!e) return;
      if (!(await ask('Excluir item?', `${esc(e.desc)} · ${money(e.amount)}`, 'excluir'))) return;
      state.expenses = state.expenses.filter(x => x.id !== id); state.deleted.push(id); commit(); }
  });
  const shareUrl = () => `${location.origin}${location.pathname}#c=${encodeURIComponent(roomName)}`;
  $('#shareBtn').onclick = async () => { const url = shareUrl();
    try { await navigator.clipboard.writeText(url); toast('Link copiado. Quem abrir cai neste evento.'); } catch { showCopy('Link do evento', url); } };
  function joinNames(names){ return names.length <= 1 ? names.join('') : names.slice(0,-1).join(', ') + ' e ' + names[names.length-1]; }
  function summaryText(){
    const st = settlements(balances()); const ev = roomName || 'acerto';
    if (!st.length) return `🎉 tá tudo quitado no *${ev}*!\n${shareUrl()}`;
    return [`🧾 acerto do *${ev}*`, '', ...st.map(t => `💸 ${nameOf(t.from)} paga ${money(t.cents/100)} pra ${nameOf(t.to)}${pixKeys[t.to] ? ` (pix: ${pixKeys[t.to]})` : ''}`), '', `tudo aqui 👉 ${shareUrl()}`].join('\n');
  }
  // ---------- imagem da comanda (canvas) ----------
  async function renderReceipt(){
    await document.fonts.load("28px 'VT323'");
    const b = balances(), st = settlements(b);
    const pays = state.expenses.filter(e => e.kind === 'payment').slice(-5).reverse();
    const items = [...state.expenses.filter(e => e.kind !== 'payment')].reverse();
    const totalCents = items.reduce((a, e) => a + Math.round(e.amount*100), 0);
    const W = 720, M = 24, P = 36, S = 2, FS = 28, LH = 34;
    const cc = document.createElement('canvas'); cc.width = W*S; cc.height = 4000*S; const x = cc.getContext('2d'); x.scale(S, S);
    x.font = `${FS}px 'VT323'`; x.textBaseline = 'alphabetic';
    const cw = x.measureText('M').width, COLS = Math.floor((W - 2*M - 2*P) / cw);
    const INK = '#2a2a2a', INK2 = '#5a5a5a', PAPER = '#efe9d8', HL = '#f7f23a';
    const MARK = ['#fff176','#b9f6a5','#ffb3d9','#a8d8ff','#ffcc80','#d9b3ff','#a7f3e6','#ffd6a5','#e0e0e0','#f4c7ab'];
    const markOf = id => MARK[Math.max(0, state.people.findIndex(p => p.id === id)) % MARK.length];
    const mark = (col, len, color) => { x.fillStyle = color; x.fillRect(L + col*cw - 3, y - FS*0.72, len*cw + 6, FS*0.9); };
    const L = M + P; let y = M + 12 + 50;
    const up = t => String(t).toUpperCase();
    const fit = (t, n) => { t = up(t); return t.length > n ? t.slice(0, Math.max(1, n - 1)) + '…' : t; };
    const num = cents => fmt(cents/100);
    const numBig = cents => { const [i, d] = (Math.abs(cents)/100).toFixed(2).split('.'); return i.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + d; };
    const line = (t, col = INK) => { x.fillStyle = col; x.textAlign = 'left'; x.fillText(t, L, y); y += LH; };
    const center = (t, hl) => { x.textAlign = 'center'; if (hl) { const w = x.measureText(t).width + 16; x.fillStyle = HL; x.fillRect(W/2 - w/2, y - FS*0.75, w, FS*0.95); } x.fillStyle = INK; x.fillText(t, W/2, y); y += LH; };
    const dash = () => line('-'.repeat(COLS), INK2);
    const blank = () => { y += LH*0.6; };
    const norm = t => up(t).normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    const initial = id => { const n = norm(nameOf(id)); let k = 1; while (k < n.length && state.people.some(p => p.id !== id && norm(nameOf(p.id)).slice(0, k) === n.slice(0, k))) k++; return n.slice(0, k); };
    const wrap = (t, col) => { const words = up(t).split(' '); let cur = ''; for (const w of words) { if (cur && (cur + ' ' + w).length > COLS - 2) { line('  ' + cur, col); cur = w; } else cur = cur ? cur + ' ' + w : w; } if (cur) line('  ' + cur, col); };
    const now = new Date(); const d2 = now.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit', year:'2-digit'}); const hm = now.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}).replace(':', ':') + 'H';

    center(`*** TÔ LISA ***`, true);
    x.fillStyle = INK2; x.textAlign = 'center'; x.fillText('quem me deve?', W/2, y); y += LH;
    center(fit(`${up(roomName)} · ${d2} ${hm}`, COLS)); blank(); dash(); blank();

    // acerto: QUEM | PRA QUEM | VALOR
    const VW = 10, TW = Math.floor((COLS - VW - 2) / 2), FW = COLS - VW - 2 - TW;
    if (!st.length && !pays.length) center('TUDO QUITADO');
    for (const t of st) { const a = fit(nameOf(t.from), FW), b = fit(nameOf(t.to), TW);
      mark(0, a.length, markOf(t.from)); mark(FW + 1, b.length, markOf(t.to));
      line(a.padEnd(FW) + ' ' + b.padEnd(TW) + ' ' + num(t.cents).padStart(VW));
      if (pixKeys[t.to]) line('  ' + fit(`PIX: ${pixKeys[t.to]}`, COLS - 2), INK2); }
    for (const e of pays) { const t = fit(nameOf(e.payer), FW).padEnd(FW) + ' ' + fit(nameOf(e.among[0]), TW).padEnd(TW) + ' ' + num(Math.round(e.amount*100)).padStart(VW);
      const yy = y; line(t, INK2); x.strokeStyle = INK2; x.lineWidth = 2; x.beginPath(); x.moveTo(L, yy - FS*0.32); x.lineTo(L + x.measureText(t).width, yy - FS*0.32); x.stroke();
    }
    blank(); dash();

    // itens: descrição ...... valor, com quem pagou embaixo
    const leader = (l, v) => { l = fit(l, COLS - VW - 2); const dots = '.'.repeat(Math.max(1, COLS - l.length - v.length - 2)); return `${l} ${dots} ${v}`; };
    if (!items.length) line('NADA ANOTADO');
    for (const e of items) { const cents = Math.round(e.amount*100);
      line(leader(e.desc, num(cents)));
      const pn = fit(nameOf(e.payer), 14); mark(2, pn.length, markOf(e.payer));
      if (e.shares || !e.among.includes(e.payer)) { wrap(`${pn} pagou · ${howText(e)}`, INK2); continue; }
      const all = state.people.every(p => e.among.includes(p.id));
      if (all) { line('  ' + fit(`${pn} pagou · ÷${e.among.length} todos`, COLS - 2), INK2); continue; }
      const head = `  ${pn} PAGOU · ÷${e.among.length} `; let col = head.length, t = head;
      for (const id of e.among) { const ini = initial(id); if (col + ini.length > COLS) break; mark(col, ini.length, markOf(id)); t += ini + ' '; col += ini.length + 1; }
      line(t.trimEnd(), INK2); }
    blank();
    line(leader('TOTAL', numBig(totalCents)), INK2);
    dash();
    blank(); center('VALEU, PAI!');
    y += 4;

    // papel na altura exata
    const H = y + M + 12;
    const c = document.createElement('canvas'); c.width = W*S; c.height = H*S; const g = c.getContext('2d'); g.scale(S, S);
    g.fillStyle = '#262626'; g.fillRect(0, 0, W, H);
    g.fillStyle = PAPER; g.fillRect(M, M + 12, W - 2*M, H - 2*M - 24);
    for (let i = 0; i < (W - 2*M) / 12; i++) { g.beginPath(); g.moveTo(M + i*12, M + 12); g.lineTo(M + i*12 + 6, M); g.lineTo(M + i*12 + 12, M + 12); g.fill();
      g.beginPath(); g.moveTo(M + i*12, H - M - 12); g.lineTo(M + i*12 + 6, H - M); g.lineTo(M + i*12 + 12, H - M - 12); g.fill(); }
    g.fillStyle = 'rgba(0,0,0,.03)'; for (let yy = M; yy < H - M; yy += 4) g.fillRect(M, yy, W - 2*M, 1);
    g.drawImage(cc, 0, 0, W*S, H*S, 0, 0, W, H);
    return new Promise(res => c.toBlob(res, 'image/png'));
  }
  const waText = () => window.open('https://wa.me/?text=' + encodeURIComponent(summaryText()), '_blank', 'noopener');
  $('#waBtn').onclick = async () => {
    const btn = $('#waBtn'); btn.disabled = true; toast('Gerando a imagem…');
    try {
      const blob = await renderReceipt(); const file = new File([blob], `evento-${roomName || 'grupo'}.png`, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], text: summaryText() }); return; } catch (e) { if (e.name === 'AbortError') return; }
      }
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      toast('Imagem baixada. Abrindo o WhatsApp com o texto…'); waText();
    } catch (e) { toast('Não consegui gerar a imagem: ' + e.message); waText(); }
    finally { btn.disabled = false; }
  };
  window.addEventListener('hashchange', () => location.reload());
  let tt; function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2200); }

  // ---------- início ----------
  (async () => {
    const c = location.hash.match(/#c=([^&]+)/);
    if (c) { const code = decodeURIComponent(c[1]).trim().toLowerCase(); try { return await enterRoom(code); } catch (e) { return showGate(e.message); } }
    let saved = null; try { saved = JSON.parse(ls.get('racha:room')); } catch {}
    if (saved && /^[0-9a-f]{64}$/.test(saved.id || '') && DB && !location.hash.includes('seed=')) return openGroup(saved.code, saved.id);
    ls.del('racha:room');   // resto de versão antiga
    showGate();
  })();
})();
</script>
