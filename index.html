<body>
<div id="overlay" class="hidden"><div class="paper" id="overlayBox"></div></div>

<div class="paper loading" id="app">
  <img class="stain" src="diva.png" alt="">
  <h1>Tô lisa</h1>
  <div class="c muted" id="tagline" style="margin:-2px 0 6px;text-transform:none">quem me deve?</div>
  <div id="boot" class="c"><span class="spin"></span></div>
  <div class="c">Evento <a class="link" id="roomLabel">—</a> · <span id="whoLine"></span></div>

  <div class="hr"></div>

  <div id="mine" class="hidden">
    <h2>*** Minha conta ***</h2>
    <div class="c muted" id="pixLine" style="text-transform:none;font-size:15px;margin:-4px 0 10px"></div>
    <div id="mineRows"></div>
    <div class="hr"></div>
  </div>

  <div id="itemsSec">
  <div class="row total" id="itemsHead" style="margin-top:0;cursor:pointer" title="ver itens"><span class="l"><span id="itemsCaret">▸</span> <span id="itemsCount">0 itens</span></span><span class="d"></span><span class="v" id="total">0,00</span></div>
  <div id="itemsBody" class="hidden" style="margin-top:8px">
  <div id="expenses"></div>
  <div class="c" style="margin-top:6px"><a class="link hidden" id="toggleAll"></a></div>
  </div>
  <div class="hr"></div>
  </div>

  <h2>*** Falta pagar ***</h2>
  <div id="settle"></div>
  <div class="share2" style="margin:16px 0 8px"><button id="waBtn" class="big"><svg class="wa" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg> Enviar</button></div>
  <div class="hr" style="margin:20px 0"></div>

  <div class="c" style="text-transform:none"><span id="peopleLine"></span> <a class="link" id="addPerson" title="adicionar pessoa" style="text-decoration:none">+</a></div>
  <div class="c" style="margin-top:6px;text-transform:none;font-size:15px"><a class="hidden" id="shareBtn" style="color:var(--ink2)">copiar link do evento</a></div>
  <div class="c" style="margin-top:14px">* * *<br><span id="signoff">Valeu, meu bem!</span><br>* * *</div>
  <div class="bars" id="bars" title="420420420420"></div>
  <div class="status" id="status"></div>
</div>

<button id="fab" class="fab" title="Anotar">✎</button>
<div id="sheet" class="hidden"><div class="paper">
  <h2 style="margin-top:0">Anotar</h2><p class="muted" style="margin:0 0 12px;text-align:center">quanto foi, o que foi e quem divide</p>
  <form id="expenseForm">
    <div class="two"><input id="amount" type="number" step="0.01" min="0.01" placeholder="0,00" required inputmode="decimal"><input id="desc" placeholder="O quê?" required maxlength="60"></div>
    <select id="payer" required></select>
    <div class="chips" id="splitChips"></div>
    <div id="sharesBox" class="shares hidden"></div>
    <div class="muted" id="splitHint"></div>
    <div class="muted" style="text-transform:none"><a class="link" id="modeToggle">dividir em partes diferentes</a></div>
    <button class="big">Anotar</button>
  </form>
  <div class="c" style="margin-top:12px"><button id="sheetClose" class="ghost">voltar</button></div>
</div></div>
<div id="toast" class="toast"></div>

<script src="app.js?v=__V__"></script>
<script>setTimeout(function(){var a=document.getElementById("app");if(a&&!a.classList.contains("nospin"))a.classList.remove("loading")},8000)</script>
</body>
