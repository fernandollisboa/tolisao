<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Racha</title>
<meta name="description" content="Divida gastos com amigos. Um código, um grupo. Sem conta, sem app.">
<style>
  :root{
    --bg:#f6f7f9;--card:#fff;--text:#1c1f24;--muted:#6b7280;--line:#e5e7eb;
    --accent:#1cc29f;--accent-ink:#0b3d33;--pos:#0f9d58;--neg:#d93025;--danger:#b91c1c;--warn:#b45309;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1115;--card:#171a21;--text:#e6e8ee;--muted:#9aa3b2;--line:#2a2f3a;
      --accent:#1cc29f;--accent-ink:#04211b;--pos:#34d399;--neg:#f87171;--danger:#f87171;--warn:#fbbf24;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1115;--card:#171a21;--text:#e6e8ee;--muted:#9aa3b2;--line:#2a2f3a;
    --accent:#1cc29f;--accent-ink:#04211b;--pos:#34d399;--neg:#f87171;--danger:#f87171;--warn:#fbbf24;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{padding:20px 16px 8px;max-width:760px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  h1{margin:0;font-size:22px}
  h1 small{font-weight:400;color:var(--muted);font-size:14px;margin-left:6px}
  main{max-width:760px;margin:0 auto;padding:0 16px 48px;display:grid;gap:16px}
  section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  h2{margin:0 0 12px;font-size:16px}
  form{display:flex;gap:8px;flex-wrap:wrap}
  input,select,button{font:inherit;border-radius:8px;border:1px solid var(--line);padding:8px 10px;background:var(--card);color:var(--text)}
  input[type=number]{width:120px}
  input.grow,select.grow{flex:1;min-width:140px}
  button{cursor:pointer}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
  button.ghost{background:transparent}
  button.danger{color:var(--danger);border-color:transparent;background:transparent;padding:4px 6px}
  ul{list-style:none;margin:0;padding:0}
  li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
  li:first-child{border-top:0}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0;width:100%}
  .chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:14px;cursor:pointer;user-select:none}
  .chip input{margin:0}
  .chip.on{border-color:var(--accent);background:color-mix(in oklab,var(--accent) 18%,transparent)}
  .pos{color:var(--pos);font-weight:600}
  .neg{color:var(--neg);font-weight:600}
  .muted{color:var(--muted);font-size:14px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .meta{font-size:13px;color:var(--muted)}
  .empty{color:var(--muted);font-size:14px;padding:4px 0}
  .status{font-size:13px;color:var(--muted)}
  .status.err{color:var(--warn)}
  .hidden{display:none !important}
  #overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
  #overlay .box{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:12px}
  #overlay form{flex-direction:column}
  #overlay input,#overlay select,#overlay button{width:100%}
  code.box{display:block;padding:8px;border:1px dashed var(--line);border-radius:8px;word-break:break-all;font-size:14px;user-select:all}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div id="overlay" class="hidden"><div class="box" id="overlayBox"></div></div>

<header>
  <h1>Racha <small id="roomLabel"></small></h1>
  <div class="row">
    <span id="status" class="status"></span>
    <button id="whoBtn" class="ghost" title="Trocar quem é você">Eu sou…</button>
    <button id="leaveBtn" class="ghost" title="Esquecer o código neste aparelho">Sair</button>
  </div>
</header>
<main>
  <section>
    <h2>Adicionar gasto</h2>
    <form id="expenseForm">
      <input id="desc" class="grow" placeholder="Descrição" required maxlength="60">
      <input id="amount" type="number" step="0.01" min="0.01" placeholder="0,00" required>
      <select id="payer" required></select>
      <div class="chips" id="splitChips"></div>
      <div class="row" style="width:100%;justify-content:space-between">
        <span class="muted" id="splitHint"></span>
        <button class="primary">Adicionar</button>
      </div>
    </form>
  </section>

  <section>
    <h2>Saldos</h2>
    <ul id="balances"></ul>
  </section>

  <section>
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <h2 style="margin:0">Acerto de contas</h2>
      <div class="row"><button id="zapBtn">Resumo pro zap</button><button id="waBtn" class="ghost" title="Abrir no WhatsApp">WhatsApp</button></div>
    </div>
    <ul id="settle"></ul>
  </section>

  <section>
    <h2>Gastos</h2>
    <ul id="expenses"></ul>
  </section>

  <section>
    <h2>Pessoas</h2>
    <form id="personForm">
      <input id="personName" class="grow" placeholder="Nome" required maxlength="30">
      <button>Adicionar pessoa</button>
    </form>
    <ul id="people"></ul>
  </section>

  <section>
    <div class="row" style="justify-content:space-between">
      <span class="muted">Pra convidar alguém: manda o link do site e o código.</span>
      <div class="row"><button id="shareBtn">Copiar link</button><button id="exportBtn" class="ghost">Exportar JSON</button></div>
    </div>
  </section>
</main>
<div id="toast" class="toast"></div>

<script>
(() => {
  // ---------- config ----------
  // Firebase Realtime Database (REST). Ex.: 'https://racha-xxxxx-default-rtdb.firebaseio.com'
  const DB = '';
  const POLL_MS = 6000;
  const CURRENCY = 'R$';

  const $ = s => document.querySelector(s);
  const uid = () => Math.random().toString(36).slice(2, 10);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const sha = async s => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))].map(b => b.toString(16).padStart(2, '0')).join('');
  const ls = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }, del: k => { try { localStorage.removeItem(k); } catch {} } };

  let groupId = null, roomName = '', state = null, me = null, pollTimer = null, saving = false;

  const fresh = () => ({ v:2, updatedAt: Date.now(), people:[], expenses:[], deleted:[] });
  const cacheKey = () => `racha:${groupId}`;
  const cacheSave = () => ls.set(cacheKey(), JSON.stringify(state));
  const cacheLoad = () => { try { return JSON.parse(ls.get(cacheKey())); } catch { return null; } };
  const meKey = () => `racha:${groupId}:me`;

  // ---------- merge (união por id; exclusões vencem) ----------
  function merge(a, b){
    if (!a) return b; if (!b) return a;
    const deleted = new Set([...(a.deleted||[]), ...(b.deleted||[])]);
    const byId = list => { const m = new Map(); for (const x of list||[]) if (!deleted.has(x.id)) m.set(x.id, x); return m; };
    const people = new Map([...byId(a.people), ...byId(b.people)]);
    const expenses = new Map([...byId(a.expenses), ...byId(b.expenses)]);
    return { v:2, updatedAt: Math.max(a.updatedAt||0, b.updatedAt||0),
      people:[...people.values()].sort((x,y)=>(x.at||0)-(y.at||0)),
      expenses:[...expenses.values()].sort((x,y)=>x.at-y.at),
      deleted:[...deleted].slice(-500) };
  }

  // ---------- remoto ----------
  const setStatus = (msg, err) => { const el = $('#status'); el.textContent = msg; el.classList.toggle('err', !!err); };
  const roomUrl = id => `${DB}/rooms/${id}.json`;
  async function apiGet(id){
    const r = await fetch(roomUrl(id), { cache:'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    if (data === null) throw Object.assign(new Error('não encontrado'), { notFound:true });
    return data;
  }
  async function apiPut(id, data){
    const r = await fetch(roomUrl(id), { method:'PUT', body: JSON.stringify(data) });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
  }

  async function sync(){            // baixa, mescla e sobe se houver novidade
    if (!groupId || saving) return;
    saving = true;
    try {
      const remote = await apiGet(groupId);
      const merged = merge(state, remote);
      const changed = JSON.stringify(merged) !== JSON.stringify(remote);
      state = merged; cacheSave(); render();
      if (changed) await apiPut(groupId, state);
      setStatus('Sincronizado ' + new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}));
    } catch (e) {
      if (e.notFound) return showLost();
      setStatus('Offline · ' + e.message, true);
    } finally { saving = false; }
  }
  function commit(){ state.updatedAt = Date.now(); cacheSave(); render(); sync(); }
  function startPolling(){ clearInterval(pollTimer); pollTimer = setInterval(() => { if (!document.hidden) sync(); }, POLL_MS); }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });

  // ---------- contas ----------
  function shares(cents, ids){ const base = Math.floor(cents/ids.length), rem = cents - base*ids.length; const o={}; ids.forEach((id,i)=>o[id]=base+(i<rem?1:0)); return o; }
  function balances(){
    const b = {}; state.people.forEach(p => b[p.id] = 0);
    for (const e of state.expenses) {
      const ids = e.among.filter(id => id in b); if (!ids.length || !(e.payer in b)) continue;
      const cents = Math.round(e.amount*100); b[e.payer] += cents; const sh = shares(cents, ids); for (const id of ids) b[id] -= sh[id];
    }
    return b;
  }
  function settlements(b){
    const d=[], c=[]; for (const [id,v] of Object.entries(b)) { if (v<0) d.push({id,c:-v}); else if (v>0) c.push({id,c:v}); }
    d.sort((x,y)=>y.c-x.c); c.sort((x,y)=>y.c-x.c); const out=[]; let i=0,j=0;
    while (i<d.length && j<c.length) { const a=Math.min(d[i].c,c[j].c); out.push({from:d[i].id,to:c[j].id,cents:a}); d[i].c-=a; c[j].c-=a; if(!d[i].c)i++; if(!c[j].c)j++; }
    return out;
  }

  // ---------- render ----------
  const money = n => `${CURRENCY} ${Math.abs(n).toFixed(2).replace('.', ',')}`;
  const nameOf = id => (state.people.find(p => p.id === id) || {name:'?'}).name;
  const listNames = ids => ids.map(nameOf).map(esc).join(', ');
  function render(){
    if (!state) return;
    $('#roomLabel').textContent = roomName ? `· ${roomName}` : '';
    document.title = roomName ? `${roomName} · Racha` : 'Racha';
    $('#whoBtn').textContent = me && state.people.some(p => p.id === me) ? `Eu sou ${nameOf(me)}` : 'Eu sou…';

    const b = balances();
    $('#people').innerHTML = state.people.map(p => `<li><span>${esc(p.name)}${p.id===me?' <span class="muted">(você)</span>':''}</span><button class="danger" data-del-person="${p.id}" title="Remover">✕</button></li>`).join('') || '<li class="empty">Ninguém ainda.</li>';

    const payerSel = $('#payer'); const prevPayer = payerSel.value || me;
    payerSel.innerHTML = state.people.map(p => `<option value="${p.id}">${esc(p.name)} pagou</option>`).join('');
    if (state.people.some(p => p.id === prevPayer)) payerSel.value = prevPayer;

    const prev = [...document.querySelectorAll('#splitChips input')];
    const known = new Set(prev.map(i => i.value)), checked = new Set(prev.filter(i => i.checked).map(i => i.value));
    $('#splitChips').innerHTML = state.people.map(p => { const on = !known.has(p.id) || checked.has(p.id);
      return `<label class="chip ${on?'on':''}"><input type="checkbox" value="${p.id}" ${on?'checked':''}>${esc(p.name)}</label>`; }).join('');
    updateHint();

    $('#balances').innerHTML = state.people.map(p => { const c=b[p.id], cls=c>0?'pos':c<0?'neg':'muted';
      const txt = c>0?`recebe ${money(c/100)}`:c<0?`deve ${money(c/100)}`:'quites';
      return `<li><span>${esc(p.name)}</span><span class="${cls}">${txt}</span></li>`; }).join('') || '<li class="empty">Adicione pessoas primeiro.</li>';

    $('#settle').innerHTML = settlements(b).map(t => `<li><span>${esc(nameOf(t.from))} paga ${esc(nameOf(t.to))}</span><b>${money(t.cents/100)}</b></li>`).join('') || '<li class="empty">Todo mundo quites.</li>';

    $('#expenses').innerHTML = [...state.expenses].reverse().map(e => {
      const loan = !e.among.includes(e.payer);
      const how = loan ? `${listNames(e.among)} deve${e.among.length===1?'':'m'} tudo` : `dividido por ${e.among.length}`;
      return `<li><div><div>${esc(e.desc)}</div><div class="meta">${esc(nameOf(e.payer))} pagou ${money(e.amount)} · ${how} · ${new Date(e.at).toLocaleDateString('pt-BR')}${e.by?` · lançado por ${esc(e.by)}`:''}</div></div>
        <button class="danger" data-del-expense="${e.id}" title="Excluir">✕</button></li>`; }).join('') || '<li class="empty">Nenhum gasto ainda.</li>';
  }
  function updateHint(){
    const among = [...document.querySelectorAll('#splitChips input:checked')].map(i => i.value);
    const payer = $('#payer').value; const h = $('#splitHint');
    if (!among.length) h.textContent = 'Marque quem divide esse gasto.';
    else if (!among.includes(payer)) h.textContent = `Empréstimo: ${among.map(nameOf).join(', ')} deve${among.length===1?'':'m'} o valor todo a ${nameOf(payer)}.`;
    else h.textContent = `Dividido igualmente entre ${among.length} pessoa${among.length===1?'':'s'}.`;
  }

  // ---------- telas ----------
  const overlay = (html) => { $('#overlayBox').innerHTML = html; $('#overlay').classList.remove('hidden'); };
  const closeOverlay = () => $('#overlay').classList.add('hidden');

  function showGate(msg){
    overlay(`<h2>Racha</h2><p class="muted" style="margin:0">${msg || 'Digite o código do grupo.'}</p>
      <form id="gateForm" autocomplete="off"><input id="gateCode" placeholder="Código" required autofocus autocapitalize="none">
      <p id="gateErr" class="status err" style="margin:0"></p><button class="primary">Entrar</button></form>`);
    $('#gateForm').onsubmit = async ev => {
      ev.preventDefault();
      const btn = ev.target.querySelector('button'); btn.disabled = true; btn.textContent = 'Abrindo…';
      try { await enterRoom($('#gateCode').value.trim().toLowerCase()); }
      catch (e) { $('#gateErr').textContent = e.message; btn.disabled = false; btn.textContent = 'Entrar'; }
    };
  }
  function showWho(){
    const opts = state.people.map(p => `<option value="${p.id}" ${p.id===me?'selected':''}>${esc(p.name)}</option>`).join('');
    overlay(`<h2>Quem é você?</h2><p class="muted" style="margin:0">Vira o pagador padrão e aparece nos gastos que você lançar.</p>
      <form id="whoForm"><select id="whoSel"><option value="">— escolha seu nome —</option>${opts}<option value="__new">Outra pessoa (me adicionar)</option></select>
      <input id="whoNew" class="hidden" placeholder="Seu nome" maxlength="30"><button class="primary">Continuar</button></form>`);
    $('#whoSel').onchange = () => $('#whoNew').classList.toggle('hidden', $('#whoSel').value !== '__new');
    $('#whoForm').onsubmit = ev => { ev.preventDefault(); let v = $('#whoSel').value;
      if (v === '__new') { const n = $('#whoNew').value.trim(); if (!n) return; const p = { id: uid(), name: n, at: Date.now() }; state.people.push(p); v = p.id; commit(); }
      if (!v) return; me = v; ls.set(meKey(), me); closeOverlay(); render(); $('#payer').value = me; updateHint(); };
  }
  function showLost(){
    clearInterval(pollTimer);
    const cached = cacheLoad();
    overlay(`<h2>Grupo não encontrado</h2><p class="muted" style="margin:0">Esse grupo não está mais no banco.</p>
      ${cached ? `<button id="restoreBtn" class="primary">Restaurar da minha cópia</button>` : ''}<button id="lostBack" class="ghost">Voltar</button>`);
    if (cached) $('#restoreBtn').onclick = async () => { try { await apiPut(groupId, cached); location.reload(); } catch (e) { toast('Falhou: ' + e.message); } };
    $('#lostBack').onclick = leave;
  }

  // ---------- salas (código → grupo) ----------
  async function enterRoom(code){
    if (!code) throw new Error('Digite um código.');
    if (!DB) throw new Error('Armazenamento ainda não configurado (DB vazio no index.html).');
    const id = await sha(code);
    let existing = null;
    try { existing = await apiGet(id); } catch (e) { if (!e.notFound) throw new Error('Sem conexão com o banco: ' + e.message); }
    const seed = location.hash.match(/#seed=([A-Za-z0-9+/=_-]+)/);
    if (!existing) {
      if (!seed && !confirm(`Não existe grupo com o código "${code}". Criar um grupo novo com esse código?`)) throw new Error('Confira o código.');
      let data = fresh();
      if (seed) { try { data = { ...fresh(), ...JSON.parse(decodeURIComponent(escape(atob(seed[1].replace(/-/g,'+').replace(/_/g,'/'))))), updatedAt: Date.now() }; } catch {} }
      await apiPut(id, data);
      history.replaceState(null, '', location.pathname);
    }
    ls.set('racha:room', JSON.stringify({ code, id }));
    await openGroup(code, id);
  }
  async function openGroup(code, id){
    roomName = code; groupId = id; me = ls.get(meKey());
    state = cacheLoad(); if (state) render();
    closeOverlay(); setStatus('Carregando…');
    try { const remote = await apiGet(groupId); state = merge(state, remote); cacheSave(); render(); setStatus('Sincronizado'); }
    catch (e) { if (e.notFound) return showLost(); if (!state) { state = fresh(); render(); } setStatus('Offline · ' + e.message, true); }
    if (!me || !state.people.some(p => p.id === me)) showWho();
    startPolling(); sync();
  }
  function leave(){ ls.del('racha:room'); location.hash = ''; location.reload(); }

  // ---------- eventos ----------
  $('#personForm').onsubmit = ev => { ev.preventDefault(); const name = $('#personName').value.trim(); if (!name) return;
    if (state.people.some(p => p.name.toLowerCase() === name.toLowerCase())) return toast('Já existe alguém com esse nome');
    state.people.push({ id: uid(), name, at: Date.now() }); $('#personName').value = ''; commit(); };
  $('#expenseForm').onsubmit = ev => { ev.preventDefault();
    const among = [...document.querySelectorAll('#splitChips input:checked')].map(i => i.value); const amount = parseFloat($('#amount').value);
    if (!state.people.length) return toast('Adicione pessoas primeiro'); if (!among.length) return toast('Marque quem divide esse gasto'); if (!(amount > 0)) return toast('Valor inválido');
    state.expenses.push({ id: uid(), desc: $('#desc').value.trim(), amount: Math.round(amount*100)/100, payer: $('#payer').value, among, at: Date.now(), by: me ? nameOf(me) : undefined });
    $('#desc').value = ''; $('#amount').value = ''; commit(); toast('Gasto adicionado'); };
  $('#payer').onchange = updateHint;
  document.addEventListener('change', ev => { if (ev.target.matches('#splitChips input')) { ev.target.closest('.chip').classList.toggle('on', ev.target.checked); updateHint(); } });
  document.addEventListener('click', ev => {
    const dp = ev.target.closest('[data-del-person]');
    if (dp) { const id = dp.dataset.delPerson; if (state.expenses.some(e => e.payer === id || e.among.includes(id))) return toast('Essa pessoa tem gastos; exclua-os primeiro');
      if (!confirm(`Remover ${nameOf(id)}?`)) return; state.people = state.people.filter(p => p.id !== id); state.deleted.push(id); commit(); }
    const de = ev.target.closest('[data-del-expense]');
    if (de) { const id = de.dataset.delExpense; const e = state.expenses.find(x => x.id === id); if (!confirm(`Excluir "${e.desc}"?`)) return;
      state.expenses = state.expenses.filter(x => x.id !== id); state.deleted.push(id); commit(); }
  });
  $('#shareBtn').onclick = async () => { const url = `${location.origin}${location.pathname}`;
    try { await navigator.clipboard.writeText(url); toast('Link copiado. Manda junto o código!'); } catch { prompt('Copie este link:', url); } };
  function joinNames(names){ return names.length <= 1 ? names.join('') : names.slice(0,-1).join(', ') + ' e ' + names[names.length-1]; }
  function summaryText(){
    const b = balances(); const L = [];
    L.push(`🧾 *Acerto${roomName ? ' – ' + roomName : ''}*`, '', '*Gastos:*');
    if (!state.expenses.length) L.push('(nenhum)');
    for (const e of state.expenses) {
      const loan = !e.among.includes(e.payer);
      const who = loan ? `${joinNames(e.among.map(nameOf))} deve${e.among.length===1?'':'m'} tudo` : joinNames(e.among.map(nameOf));
      L.push(`• ${e.desc} – ${money(e.amount)} (${nameOf(e.payer)} pagou) → ${who}`);
    }
    L.push('', '*Saldo:*');
    const rows = state.people.map(p => [p, b[p.id]]).sort((x,y)=>y[1]-x[1]);
    for (const [p, c] of rows) L.push(c > 0 ? `✅ ${p.name} recebe ${money(c/100)}` : c < 0 ? `❌ ${p.name} deve ${money(c/100)}` : `➖ ${p.name} quites`);
    const s = settlements(b);
    L.push('', s.length ? `*Pra zerar tudo (${s.length} pix):*` : '*Todo mundo quites!* 🎉');
    for (const t of s) L.push(`💸 ${nameOf(t.from)} → ${nameOf(t.to)}: ${money(t.cents/100)}`);
    L.push('', 'Qualquer coisa é só falar 🙏');
    return L.join('\n');
  }
  $('#zapBtn').onclick = async () => { const t = summaryText(); try { await navigator.clipboard.writeText(t); toast('Resumo copiado. Cola no zap!'); } catch { prompt('Copie o resumo:', t); } };
  $('#waBtn').onclick = () => window.open('https://wa.me/?text=' + encodeURIComponent(summaryText()), '_blank', 'noopener');
  $('#whoBtn').onclick = showWho;
  $('#leaveBtn').onclick = () => { if (confirm('Sair do grupo neste aparelho? Você pode voltar digitando o código.')) leave(); };
  $('#exportBtn').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], {type:'application/json'}));
    a.download = `racha-${roomName || 'grupo'}.json`; a.click(); URL.revokeObjectURL(a.href); };
  let tt; function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2200); }

  // ---------- início ----------
  (async () => {
    let saved = null; try { saved = JSON.parse(ls.get('racha:room')); } catch {}
    if (saved && saved.id && DB && !location.hash.includes('seed=')) return openGroup(saved.code, saved.id);
    showGate();
  })();
})();
</script>
