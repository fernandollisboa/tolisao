</head>
<body>
<div id="overlay" class="hidden"><div class="paper" id="overlayBox"></div></div>

<div class="paper loading" id="app">
  <img class="stain" src="diva.png" alt="">
  <h1>Tô lisa</h1>
  <div class="c muted" id="tagline" style="margin:-2px 0 6px;text-transform:none">quem me deve?</div>
  <div id="boot" class="c"><span class="spin"></span></div>
  <div class="c">Evento <a class="link" id="roomLabel">—</a> · <span id="whoLine"></span></div>

  <div class="hr"></div>

  <div id="mine" class="hidden">
    <h2>*** Minha conta ***</h2>
    <div class="c muted" id="pixLine" style="text-transform:none;font-size:15px"></div>
    <div id="mineRows"></div>
    <div class="hr"></div>
  </div>

  <div id="itemsSec">
  <div class="row total" id="itemsHead" style="margin-top:0;cursor:pointer" title="ver itens"><span class="l"><span id="itemsCaret"><span>▸</span></span> <span id="itemsCount">0 itens</span></span><span class="d"></span><span class="v" id="total">0,00</span></div>
  <div id="itemsBody" class="hidden" style="margin-top:8px">
  <div id="expenses"></div>
  <div class="c" style="margin-top:6px"><a class="link hidden" id="toggleAll"></a></div>
  </div>
  <div class="hr"></div>
  </div>

  <h2 id="settleHead">*** Falta pagar ***</h2>
  <div id="settle"></div>
  
  <div class="hr" style="margin:20px 0"></div>

  <div class="c" id="peopleSec" style="text-transform:none"><span id="peopleLine"></span><a class="link" id="addPerson" title="adicionar pessoa">,+</a></div>
  <div class="c" style="margin-top:6px;text-transform:none;font-size:15px"><a class="hidden" id="shareBtn" style="color:var(--ink2)">copiar link do evento</a></div>
  <div class="c" style="margin-top:8px"><button class="ico amb hidden" id="instalar"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 11l5 5 5-5M4 20h16"/></svg> instalar</button></div>
  <div class="c" style="margin-top:14px">* * *<br><span id="signoff">Valeu, meu bem!</span><br>* * *</div>
  <div class="bars" id="bars" title="420420420420"></div>
  <div class="status" id="status"></div>
</div>

<div id="dica" class="hidden">anota o primeiro gasto aqui</div>
<button id="waBtn" class="fab wafab" title="Mandar no zap"><span class="wa-lbl"><svg class="wa" viewBox="0 0 24 24" width="27" height="27" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="M8.6 13.4 15.4 17.4M15.4 6.6 8.6 10.6"/></svg></span></button>
<button id="fab" class="fab" title="Anotar"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.4 3.9a2 2 0 0 1 2.8 2.8L8.1 17.8l-3.6.9.9-3.6L16.4 3.9Z"/><path d="M16 18h6M19 15v6"/></svg></button>
<div id="sheet" class="hidden"><div class="paper">
  <h2 style="margin-top:0">Anotar</h2>
  <form id="expenseForm">
    <div class="two"><input id="amount" type="text" inputmode="decimal" enterkeyhint="next" autocomplete="off" placeholder="0,00" required><input id="desc" placeholder="O quê?" required maxlength="60" enterkeyhint="done" autocomplete="off" autocapitalize="sentences"></div>
    <select id="payer" required></select>
    <div class="chips" id="splitChips"></div>
    <div id="sharesBox" class="shares hidden"></div>
    <div class="muted" id="splitHint"></div>
    <button class="big">Anotar</button>
  </form>
  <div class="c" style="margin-top:12px"><button id="sheetClose" class="ghost">voltar</button></div>
</div></div>
<div id="toast" class="toast"></div>

<script src="app.js?v=20260924a"></script>
<script>setTimeout(function(){var a=document.getElementById("app");if(a&&!a.classList.contains("nospin"))a.classList.remove("loading")},8000)</script>
</body>
</html>
